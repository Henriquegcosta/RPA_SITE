<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processamento da folha · Pão D’Ouro RH</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="app">

    <!-- MENU LATERAL (igual em todas as páginas) -->
    <aside>
      <div class="brand"><i>🥖</i>Pão D’Ouro</div>
      <nav><a href="index.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v5l4 2-1 1.7-5-2.7V7z" />
          </svg>Registros de ponto</a><a href="folha.html" class="on"><svg viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path d="M4 4h16v4H4zm0 6h10v10H4zm12 0h4v10h-4z" />
          </svg>Processamento da folha</a><a href="relatorios.html"><svg viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8 12h8v1.5H8zm0 4h8v1.5H8z" />
          </svg>Relatórios</a><a href="pendencias.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2L1 21h22zm1 15h-2v-2h2zm0-4h-2V9h2z" />
          </svg>Logs</a></nav>
    </aside>

    <div>
      <!-- CABEÇALHO -->
      <header>
        <h1>Processamento da folha</h1>
        <small>Pão D’Ouro · RH</small>
      </header>

      <!-- CONTEÚDO DA PÁGINA -->
      <main>
        <!-- FORMULÁRIO DE LANÇAMENTO POR FUNCIONÁRIO -->
        <form class="card" id="formFolha">
          <h2>Lançamento por funcionário</h2>
          <div class="form">
            <div class="span2"><label for="periodo">Período de referência</label><select id="periodo" name="periodo">
                <option>Janeiro de 2026</option>
                <option>Fevereiro de 2026</option>
                <option>Março de 2026</option>
                <option>Abril de 2026</option>
                <option>Maio de 2026</option>
                <option>Junho de 2026</option>
                <option>Julho de 2026</option>
                <option>Agosto de 2026</option>
                <option>Setembro de 2026</option>
                <option selected>Outubro de 2026</option>
                <option>Novembro de 2026</option>
                <option>Dezembro de 2026</option>
              </select></div>
            <div class=""><label for="idTrabalhador">ID do trabalhador</label><input id="idTrabalhador"
                name="idTrabalhador" placeholder="Ex.: 1042"><button class="btn sm sec" type="button" id="buscarFuncionario" style="margin-top:8px">Buscar ID</button></div>
            <div class=""><label for="nome">Nome</label><input id="nome" name="nome" placeholder="Nome completo" readonly></div>
            <div class=""><label for="horasTrabalhadas">Horas trabalhadas</label><input id="horasTrabalhadas"
                name="horasTrabalhadas" type="number" min="0" step="0.01" required placeholder="Ex.: 176"></div>
            <div class=""><label for="he50">Horas extras 50%</label><input id="he50" name="he50" type="number" min="0" step="0.01"
                value="0"></div>
            <div class=""><label for="he100">Horas extras 100%</label><input id="he100" name="he100" type="number" min="0" step="0.01"
                value="0"></div>
            <div class=""><label for="faltas">Faltas</label><input id="faltas" name="faltas" type="number" min="0" step="1" value="0">
            </div>
            <div class=""><label for="atestados">Atestados</label><input id="atestados" name="atestados" type="number" min="0" step="1"
                value="0"></div>
            <div class="span2" style="align-self:end"><button class="btn" type="submit">＋ Registrar funcionário</button>
            </div>
          </div>
        </form>

        <!-- LISTA DE FUNCIONÁRIOS LANÇADOS -->
        <div class="card" style="margin-top:16px">
          <div class="row">
            <h2 style="margin:0">Funcionários lançados</h2>
          </div>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Período</th>
                  <th class="n">Horas</th>
                  <th class="n">HE 50%</th>
                  <th class="n">HE 100%</th>
                  <th class="n">Faltas</th>
                  <th class="n">Atestados</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="listaLancamentos">
                <tr><td colspan="9">Carregando lançamentos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

<script>
const form = document.getElementById('formFolha');
const campo = id => document.getElementById(id);
const mostrar = mensagem => alert(mensagem);
async function requisicao(url, opcoes) {
  const resposta = await fetch(url, opcoes);
  const dados = await resposta.json();
  if (!resposta.ok) throw new Error(dados.erro || 'Falha na operação');
  return dados;
}
async function buscar() {
  campo('nome').value = '';
  try {
    const funcionario = await requisicao('/api/funcionario?id=' + encodeURIComponent(campo('idTrabalhador').value));
    campo('nome').value = funcionario.nome;
  } catch (erro) { mostrar(erro.message); }
}
campo('buscarFuncionario').addEventListener('click', buscar);
campo('idTrabalhador').addEventListener('change', buscar);
async function carregar() {
  const tbody = campo('listaLancamentos');
  try {
    const lista = await requisicao('/api/lancamentos');
    tbody.replaceChildren();
    if (!lista.length) {
      const tr=document.createElement('tr');
      const td=document.createElement('td'); td.colSpan=9; td.textContent='Nenhum lançamento registrado.';
      tr.appendChild(td); tbody.appendChild(tr); return;
    }
    for (const item of lista) {
      const tr=document.createElement('tr');
      for (const valor of [item.funcionario_id,item.nome,item.periodo,item.horas_trabalhadas,item.he50,item.he100,item.faltas,item.atestados]) {
        const td=document.createElement('td'); td.textContent=valor; tr.appendChild(td);
      }
      const td=document.createElement('td');
      const btn=document.createElement('button'); btn.type='button'; btn.className='btn sm sec'; btn.textContent='Remover';
      btn.addEventListener('click',async () => {
        if (!confirm('Remover este lançamento?')) return;
        try { await requisicao('/api/remover-lancamento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})}); await carregar(); }
        catch (erro) { mostrar(erro.message); }
      });
      td.appendChild(btn); tr.appendChild(td); tbody.appendChild(tr);
    }
  } catch (erro) { tbody.textContent='Erro ao carregar lançamentos: '+erro.message; }
}
form.addEventListener('submit',async evento => {
  evento.preventDefault();
  const dados={
    funcionario_id:campo('idTrabalhador').value,
    nome:campo('nome').value,
    periodo:campo('periodo').value,
    horas_trabalhadas:campo('horasTrabalhadas').value,
    he50:campo('he50').value,
    he100:campo('he100').value,
    faltas:campo('faltas').value,
    atestados:campo('atestados').value
  };
  try {
    const resposta=await requisicao('/api/lancamentos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
    mostrar(resposta.mensagem); form.reset(); await carregar();
  } catch (erro) { mostrar(erro.message); }
});
carregar();
</script>
</body>

</html>
